name: AniSnatch page urls list Scraper

on:
 #schedule:
   #- cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "full_range"
        type: choice
        options:
          - full_range
          - daily_update

      page_start:
        description: "Start page (full_range only, e.g. 2)"
        required: false
        default: "1"
        type: string

      page_end:
        description: "End page (full_range only, e.g. 25)"
        required: false
        default: "4"
        type: string

concurrency:
  group: anisnatch-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Set env vars
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "MODE=daily_update" >> $GITHUB_ENV
            echo "PAGE_START=1"      >> $GITHUB_ENV
            echo "PAGE_END=4"        >> $GITHUB_ENV
          else
            echo "MODE=${{ github.event.inputs.mode }}"             >> $GITHUB_ENV
            echo "PAGE_START=${{ github.event.inputs.page_start }}" >> $GITHUB_ENV
            echo "PAGE_END=${{ github.event.inputs.page_end }}"     >> $GITHUB_ENV
          fi

      - name: Run scraper
        run: python anime-page-only-url-scraper.py

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Token-authenticated remote so push is authorised
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          # Stage all part files (new, modified, or deleted)
          git add anime-page-only-url-scraper*.json

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          if [ "$MODE" = "daily_update" ]; then
            MSG="chore: daily update $(date -u '+%Y-%m-%d')"
          else
            MSG="chore: scrape pages ${PAGE_START}-${PAGE_END} $(date -u '+%Y-%m-%d')"
          fi

          git commit -m "$MSG"
          git push
