name: AniSnatch Scraper

on:
  # ── Auto: daily at 06:00 UTC ─────────────────────────────────────────────
  schedule:
    - cron: "0 6 * * *"

  # ── Manual: user picks mode + page range ─────────────────────────────────
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "full_range"
        type: choice
        options:
          - full_range      # scrape a custom page range
          - daily_update    # same as auto (pages 1-4 + refresh ongoing/aired)

      page_start:
        description: "Start page (full_range only, e.g. 2)"
        required: false
        default: "1"
        type: string

      page_end:
        description: "End page   (full_range only, e.g. 25)"
        required: false
        default: "4"
        type: string

# only one run at a time — prevents race conditions on urls_list.json
concurrency:
  group: anisnatch-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360     # 6 h — enough for any full page range

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install Python deps
        run: pip install playwright

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      # ── 4. Determine mode & page range ───────────────────────────────────
      #    schedule trigger  → daily_update, pages 1-4
      #    workflow_dispatch → whatever the user picked
      - name: Set env vars
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "MODE=daily_update"   >> $GITHUB_ENV
            echo "PAGE_START=1"        >> $GITHUB_ENV
            echo "PAGE_END=4"          >> $GITHUB_ENV
          else
            echo "MODE=${{ github.event.inputs.mode }}"             >> $GITHUB_ENV
            echo "PAGE_START=${{ github.event.inputs.page_start }}" >> $GITHUB_ENV
            echo "PAGE_END=${{ github.event.inputs.page_end }}"     >> $GITHUB_ENV
          fi

      # ── 5. Run scraper ────────────────────────────────────────────────────
      - name: Run scraper
        env:
          CF_CLEARANCE: ${{ secrets.CF_CLEARANCE }}
        run: python anime-page-only-url-scraper.py

      # ── 6. Commit & push urls_list.json ──────────────────────────────────
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add urls_list.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          
          # Build a descriptive commit message
          if [ "$MODE" = "daily_update" ]; then
            MSG="chore: daily update $(date -u '+%Y-%m-%d')"
          else
            MSG="chore: scrape pages ${PAGE_START}-${PAGE_END} $(date -u '+%Y-%m-%d')"
          fi
          git commit -m "$MSG"
          git push
