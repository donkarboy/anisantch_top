name: Extract Stream URLs

on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: "How many URLs to process this run"
        required: false
        default: "100"
        type: choice
        options:
          - "2"
          - "20"
          - "50"
          - "100"
          - "250"
          - "500"
          - "1000"
          - "5000"
          - "full"
  schedule:
    - cron: "*/ * * * *"   # runs every 30 minutes; uses the default batch limit (100)

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install playwright

      - run: playwright install chromium && playwright install-deps chromium

      - name: Run extractor
        # Input sources (handled automatically inside anisnatch_extract.py):
        #   1. inputed_urls_list.txt  — local plain-text list (range-expanded)
        #   2. JSON catalogue         — fetched from JSON_CATALOGUE_URL in the script
        #      Status routing: "aired" / "ongoing" → aired_url field
        #                      "complete"           → url field
        run: |
          LIMIT="${{ github.event.inputs.batch_limit || '100' }}"
          echo "[workflow] Batch limit: $LIMIT"
          python anisnatch_extract.py --limit "$LIMIT"

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage all auto-created and auto-split files
          git add streams*.json
          git add already_processed_urls_list.txt
          git add error_faced_urls_list.txt
          git add failed_extract_server_urls_list.txt || true
          git diff --cached --quiet || git commit -m "update streams [$(date -u '+%Y-%m-%d %H:%M UTC')] limit=${{ github.event.inputs.batch_limit || '100' }}"
          git push
